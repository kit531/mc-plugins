plugins {
	id 'java'
}

version = '1.0.1'
group = 'dev.adamk'

repositories {
	mavenCentral()
	maven {
		name = 'PaperMC'
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
}

dependencies {
	compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
	// Bundled with every Paper server already - compileOnly avoids shading a
	// second copy into the plugin jar.
	compileOnly 'com.google.code.gson:gson:2.11.0'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('plugin.yml') {
		expand 'version': version
	}
}

// Fixed output name (no version in the filename): the auto-updater always
// stages the new build at plugins/update/CheckPoints.jar, and Paper's
// built-in updater only swaps in a file whose name matches the one already
// in plugins/ - a versioned filename would never match on the next release.
jar {
	archiveFileName = 'CheckPoints.jar'
}
