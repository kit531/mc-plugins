# Remote language pack (translations + new plugin support without recompiling)
remote:
  enabled: true
  # Host your language-pack.yml (e.g. GitHub raw) and change this URL
  url: "https://cdn.jsdelivr.net/gh/kit531/mc-plugins@master/LanguagePlugin/language-pack.yml"
  # Re-check every N minutes (0 = only on server start)
  check-interval-minutes: 30
